# Dev copy of shopify.app.toml for testing on a dev store: `shopify app dev --config backsoon-dev`.
# URLs are placeholders; the CLI swaps them for the tunnel on `app dev`.

client_id = "20b74ecbb1d6385c0ad3c2b6bd31679f"
name = "BackSoon Dev"
application_url = "https://example.com"
embedded = true

[access_scopes]
scopes = "read_customers,read_products,write_app_proxy,write_customers"

[app_proxy]
url = "https://example.com/proxy"
prefix = "apps"
subpath = "notify-me"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/variants/in_stock"
  topics = [ "variants/in_stock" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [ "https://example.com/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
